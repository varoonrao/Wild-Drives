name: Build Wild Drives APK

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 35
        shell: bash
        run: |
          sdkmanager --version
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager
          java -version
          ls -la "$ANDROID_HOME/platforms"
          ls -la "$ANDROID_HOME/build-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify offline meshes and JavaScript
        run: python3 scripts/verify_assets.py

      - name: Build signed debug APK
        shell: bash
        run: |
          gradle --no-daemon \
            :app:assembleDebug \
            --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist

          cp app/build/outputs/apk/debug/app-debug.apk \
            dist/WildDrives-v14-debug.apk

      - name: Verify packaged game and APK signature
        shell: bash
        run: |
          python3 scripts/verify_assets.py \
            --apk dist/WildDrives-v14-debug.apk

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify --verbose \
            dist/WildDrives-v14-debug.apk

          cd dist
          sha256sum WildDrives-v14-debug.apk > SHA256SUMS.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: WildDrives-v14-APK
          path: dist/
          if-no-files-found: error
          retention-days: 30
